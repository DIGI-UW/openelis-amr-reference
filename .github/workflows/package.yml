name: Package

# A pull request builds each package and tests it. Pushing a tag
# v<version> builds, tests and publishes that version.
on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        publisher: [eucast, clsi]
    env:
      PACKAGE: amr-reference-${{ matrix.publisher }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Installed on every run so a pull request proves the release tooling too.
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: '1.3.5'
      - run: oras version
      - name: Build from the pinned WHONET release
        run: |
          version=0.0
          if [ "$RELEASE" = true ]; then version="${GITHUB_REF_NAME#v}"; fi
          python3 build_package.py --package-id "$PACKAGE" --package-version "$version" --output dist/package.zip
      - name: Test the package
        env:
          AMR_REFERENCE_ARTIFACT: dist/package.zip
        run: python3 -m unittest discover -p 'test_*.py' -v
      - name: Publish the version this tag names
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 publish_package.py dist/package.zip --repository "ghcr.io/digi-uw/$PACKAGE"
